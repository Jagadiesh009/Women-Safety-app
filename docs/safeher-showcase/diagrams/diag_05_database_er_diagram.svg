<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="erShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <text x="500" y="32" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">SAFEHER RELATIONAL DATABASE SCHEMA (ENTITY-RELATIONSHIP)</text>
  <text x="500" y="52" text-anchor="middle" fill="#94A3B8" font-size="12">SQLAlchemy Data Models • Referential Integrity • Indexing &amp; Foreign Key Constraints</text>

  <!-- User Entity -->
  <rect x="30" y="80" width="200" height="200" rx="8" fill="#1E293B" stroke="#EC4899" stroke-width="1.5" filter="url(#erShadow)"/>
  <rect x="30" y="80" width="200" height="30" rx="8" fill="#BE185D"/>
  <text x="40" y="100" fill="#FFF" font-size="13" font-weight="bold">users</text>
  <text x="40" y="125" fill="#F472B6" font-size="11">PK  id: Integer</text>
  <text x="40" y="142" fill="#CBD5E1" font-size="11">    firebase_uid: String</text>
  <text x="40" y="159" fill="#CBD5E1" font-size="11">    email: String</text>
  <text x="40" y="176" fill="#CBD5E1" font-size="11">    full_name: String</text>
  <text x="40" y="193" fill="#CBD5E1" font-size="11">    phone_number: String</text>
  <text x="40" y="210" fill="#CBD5E1" font-size="11">    blood_group: String</text>
  <text x="40" y="227" fill="#CBD5E1" font-size="11">    is_active: Boolean</text>
  <text x="40" y="244" fill="#CBD5E1" font-size="11">    created_at: DateTime</text>

  <!-- Emergency Contacts -->
  <rect x="30" y="310" width="200" height="180" rx="8" fill="#1E293B" stroke="#F472B6" stroke-width="1.5" filter="url(#erShadow)"/>
  <rect x="30" y="310" width="200" height="30" rx="8" fill="#9D174D"/>
  <text x="40" y="330" fill="#FFF" font-size="13" font-weight="bold">emergency_contacts</text>
  <text x="40" y="355" fill="#F472B6" font-size="11">PK  id: Integer</text>
  <text x="40" y="372" fill="#38BDF8" font-size="11">FK  user_id: Integer (➔ users)</text>
  <text x="40" y="389" fill="#CBD5E1" font-size="11">    name: String</text>
  <text x="40" y="406" fill="#CBD5E1" font-size="11">    phone_number: String</text>
  <text x="40" y="423" fill="#CBD5E1" font-size="11">    relationship: String</text>
  <text x="40" y="440" fill="#CBD5E1" font-size="11">    is_primary: Boolean</text>
  <text x="40" y="457" fill="#CBD5E1" font-size="11">    notify_sms: Boolean</text>

  <!-- Incidents Entity -->
  <rect x="270" y="80" width="220" height="260" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" filter="url(#erShadow)"/>
  <rect x="270" y="80" width="220" height="30" rx="8" fill="#1D4ED8"/>
  <text x="280" y="100" fill="#FFF" font-size="13" font-weight="bold">incidents</text>
  <text x="280" y="125" fill="#93C5FD" font-size="11">PK  id: Integer</text>
  <text x="280" y="142" fill="#38BDF8" font-size="11">FK  user_id: Integer (➔ users)</text>
  <text x="280" y="159" fill="#38BDF8" font-size="11">FK  officer_id: Integer (➔ police)</text>
  <text x="280" y="176" fill="#CBD5E1" font-size="11">    type: IncidentType (SOS)</text>
  <text x="280" y="193" fill="#CBD5E1" font-size="11">    status: IncidentStatus</text>
  <text x="280" y="210" fill="#CBD5E1" font-size="11">    latitude: Float</text>
  <text x="280" y="227" fill="#CBD5E1" font-size="11">    longitude: Float</text>
  <text x="280" y="244" fill="#CBD5E1" font-size="11">    address: String</text>
  <text x="280" y="261" fill="#CBD5E1" font-size="11">    battery_level: Integer</text>
  <text x="280" y="278" fill="#CBD5E1" font-size="11">    created_at: DateTime</text>
  <text x="280" y="295" fill="#CBD5E1" font-size="11">    resolved_at: DateTime</text>
  <text x="280" y="312" fill="#CBD5E1" font-size="11">    resolution_notes: Text</text>

  <!-- Locations Entity -->
  <rect x="270" y="360" width="220" height="130" rx="8" fill="#1E293B" stroke="#60A5FA" stroke-width="1.5" filter="url(#erShadow)"/>
  <rect x="270" y="360" width="220" height="30" rx="8" fill="#2563EB"/>
  <text x="280" y="380" fill="#FFF" font-size="13" font-weight="bold">locations (live tracking)</text>
  <text x="280" y="405" fill="#93C5FD" font-size="11">PK  id: Integer</text>
  <text x="280" y="422" fill="#38BDF8" font-size="11">FK  incident_id: Integer (➔ inc.)</text>
  <text x="280" y="439" fill="#CBD5E1" font-size="11">    latitude: Float</text>
  <text x="280" y="456" fill="#CBD5E1" font-size="11">    longitude: Float</text>
  <text x="280" y="473" fill="#CBD5E1" font-size="11">    timestamp: DateTime</text>

  <!-- Police Officers Entity -->
  <rect x="530" y="80" width="210" height="240" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5" filter="url(#erShadow)"/>
  <rect x="530" y="80" width="210" height="30" rx="8" fill="#047857"/>
  <text x="540" y="100" fill="#FFF" font-size="13" font-weight="bold">police_officers</text>
  <text x="540" y="125" fill="#6EE7B7" font-size="11">PK  id: Integer</text>
  <text x="540" y="142" fill="#CBD5E1" font-size="11">    badge_number: String (UNIQUE)</text>
  <text x="540" y="159" fill="#CBD5E1" font-size="11">    hashed_password: String</text>
  <text x="540" y="176" fill="#CBD5E1" font-size="11">    full_name: String</text>
  <text x="540" y="193" fill="#CBD5E1" font-size="11">    phone_number: String</text>
  <text x="540" y="210" fill="#CBD5E1" font-size="11">    station_precinct: String</text>
  <text x="540" y="227" fill="#CBD5E1" font-size="11">    is_on_duty: Boolean</text>
  <text x="540" y="244" fill="#CBD5E1" font-size="11">    is_active: Boolean</text>
  <text x="540" y="261" fill="#CBD5E1" font-size="11">    last_latitude: Float</text>
  <text x="540" y="278" fill="#CBD5E1" font-size="11">    last_longitude: Float</text>
  <text x="540" y="295" fill="#CBD5E1" font-size="11">    last_seen_at: DateTime</text>

  <!-- Police Patrol Locations -->
  <rect x="530" y="340" width="210" height="150" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1.5" filter="url(#erShadow)"/>
  <rect x="530" y="340" width="210" height="30" rx="8" fill="#065F46"/>
  <text x="540" y="360" fill="#FFF" font-size="13" font-weight="bold">police_patrol_locations</text>
  <text x="540" y="385" fill="#6EE7B7" font-size="11">PK  id: Integer</text>
  <text x="540" y="402" fill="#38BDF8" font-size="11">FK  officer_id: Integer (➔ pol.)</text>
  <text x="540" y="419" fill="#CBD5E1" font-size="11">    latitude: Float</text>
  <text x="540" y="436" fill="#CBD5E1" font-size="11">    longitude: Float</text>
  <text x="540" y="453" fill="#CBD5E1" font-size="11">    recorded_at: DateTime</text>

  <!-- Intelligence & Alerts -->
  <rect x="770" y="80" width="200" height="230" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" filter="url(#erShadow)"/>
  <rect x="770" y="80" width="200" height="30" rx="8" fill="#B45309"/>
  <text x="780" y="100" fill="#FFF" font-size="13" font-weight="bold">crime_reports</text>
  <text x="780" y="125" fill="#FDE68A" font-size="11">PK  id: Integer</text>
  <text x="780" y="142" fill="#CBD5E1" font-size="11">    title: String</text>
  <text x="780" y="159" fill="#CBD5E1" font-size="11">    category: String</text>
  <text x="780" y="176" fill="#CBD5E1" font-size="11">    locality: String</text>
  <text x="780" y="193" fill="#CBD5E1" font-size="11">    latitude: Float</text>
  <text x="780" y="210" fill="#CBD5E1" font-size="11">    longitude: Float</text>
  <text x="780" y="227" fill="#CBD5E1" font-size="11">    is_verified: Boolean</text>
  <text x="780" y="244" fill="#CBD5E1" font-size="11">    reported_at: DateTime</text>

  <!-- Admin Users -->
  <rect x="770" y="330" width="200" height="160" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5" filter="url(#erShadow)"/>
  <rect x="770" y="330" width="200" height="30" rx="8" fill="#6D28D9"/>
  <text x="780" y="350" fill="#FFF" font-size="13" font-weight="bold">admin_users</text>
  <text x="780" y="375" fill="#DDD6FE" font-size="11">PK  id: Integer</text>
  <text x="780" y="392" fill="#CBD5E1" font-size="11">    username: String (UNIQUE)</text>
  <text x="780" y="409" fill="#CBD5E1" font-size="11">    hashed_password: String</text>
  <text x="780" y="426" fill="#CBD5E1" font-size="11">    role: String ('admin')</text>
  <text x="780" y="443" fill="#CBD5E1" font-size="11">    is_active: Boolean</text>
  <text x="780" y="460" fill="#CBD5E1" font-size="11">    created_at: DateTime</text>

  <!-- Connectors -->
  <line x1="230" y1="130" x2="270" y2="130" stroke="#EC4899" stroke-width="1.5"/>
  <line x1="130" y1="280" x2="130" y2="310" stroke="#EC4899" stroke-width="1.5"/>
  <line x1="490" y1="150" x2="530" y2="150" stroke="#10B981" stroke-width="1.5"/>
  <line x1="380" y1="340" x2="380" y2="360" stroke="#3B82F6" stroke-width="1.5"/>
  <line x1="635" y1="320" x2="635" y2="340" stroke="#10B981" stroke-width="1.5"/>
</svg>
