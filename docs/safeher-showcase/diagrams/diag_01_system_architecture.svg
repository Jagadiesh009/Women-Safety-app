<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="gradCiv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <linearGradient id="gradPol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="gradAdm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="gradApi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gradDb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700" letter-spacing="1">SAFEHER MULTI-TIER SYSTEM ARCHITECTURE</text>
  <text x="500" y="65" text-anchor="middle" fill="#94A3B8" font-size="13">End-to-End Enterprise Safety Ecosystem • Real-Time Dispatch &amp; Tri-Portal Access</text>

  <!-- Presentation Layer Container -->
  <rect x="40" y="90" width="920" height="150" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="115" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="1">CLIENT &amp; PRESENTATION LAYER (TRI-PORTAL)</text>

  <!-- Mobile App -->
  <rect x="60" y="130" width="260" height="90" rx="8" fill="#0F172A" stroke="#EC4899" stroke-width="1.5"/>
  <rect x="75" y="145" width="26" height="26" rx="6" fill="url(#gradCiv)"/>
  <text x="110" y="162" fill="#F8FAFC" font-size="14" font-weight="600">React Native Mobile</text>
  <text x="110" y="180" fill="#94A3B8" font-size="11">Expo SDK • Android Native</text>
  <text x="75" y="205" fill="#EC4899" font-size="11" font-weight="500">Civilian SOS • Officer Field Ops</text>

  <!-- Public Web -->
  <rect x="370" y="130" width="260" height="90" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="385" y="145" width="26" height="26" rx="6" fill="url(#gradPol)"/>
  <text x="420" y="162" fill="#F8FAFC" font-size="14" font-weight="600">Public Web Portal</text>
  <text x="420" y="180" fill="#94A3B8" font-size="11">Vite + React • TailwindCSS • Leaflet</text>
  <text x="385" y="205" fill="#3B82F6" font-size="11" font-weight="500">Civilian Safety • Police Web Console</text>

  <!-- Admin Portal -->
  <rect x="680" y="130" width="260" height="90" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="695" y="145" width="26" height="26" rx="6" fill="url(#gradAdm)"/>
  <text x="730" y="162" fill="#F8FAFC" font-size="14" font-weight="600">Admin Operations Portal</text>
  <text x="730" y="180" fill="#94A3B8" font-size="11">Vanilla JS SPA • Leaflet • Tailwind</text>
  <text x="695" y="205" fill="#8B5CF6" font-size="11" font-weight="500">Force Ops • Audit • Incident Queue</text>

  <!-- Arrows Client -> Backend -->
  <path d="M 190 220 L 190 280 L 460 280 L 460 300" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="4"/>
  <path d="M 500 220 L 500 300" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="4"/>
  <path d="M 810 220 L 810 280 L 540 280 L 540 300" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="500,305 495,295 505,295" fill="#38BDF8"/>

  <!-- Backend Services Layer -->
  <rect x="40" y="305" width="920" height="150" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="330" fill="#34D399" font-size="12" font-weight="700" letter-spacing="1">APPLICATION &amp; DISPATCH ENGINE LAYER (FASTAPI BACKEND)</text>

  <!-- Auth Module -->
  <rect x="60" y="345" width="200" height="90" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="75" y="370" fill="#F8FAFC" font-size="13" font-weight="600">Tri-Role Auth Module</text>
  <text x="75" y="390" fill="#94A3B8" font-size="11">• Firebase JWT Verify</text>
  <text x="75" y="405" fill="#94A3B8" font-size="11">• Officer Department Auth</text>
  <text x="75" y="420" fill="#94A3B8" font-size="11">• Admin Session Guard</text>

  <!-- Dispatch Engine -->
  <rect x="285" y="345" width="200" height="90" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="300" y="370" fill="#F8FAFC" font-size="13" font-weight="600">Geo Dispatch Engine</text>
  <text x="300" y="390" fill="#94A3B8" font-size="11">• Haversine 1–5km Radius</text>
  <text x="300" y="405" fill="#94A3B8" font-size="11">• Duty-Locked Broadcast</text>
  <text x="300" y="420" fill="#94A3B8" font-size="11">• Concurrency Locking</text>

  <!-- Location Tracking -->
  <rect x="510" y="345" width="200" height="90" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="525" y="370" fill="#F8FAFC" font-size="13" font-weight="600">Location Telemetry</text>
  <text x="525" y="390" fill="#94A3B8" font-size="11">• Live GPS Stream (15s)</text>
  <text x="525" y="405" fill="#94A3B8" font-size="11">• Officer Patrol Breadcrumb</text>
  <text x="525" y="420" fill="#94A3B8" font-size="11">• Recipient Tracking URLs</text>

  <!-- Crime Intel -->
  <rect x="735" y="345" width="205" height="90" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="750" y="370" fill="#F8FAFC" font-size="13" font-weight="600">Crime Intelligence</text>
  <text x="750" y="390" fill="#94A3B8" font-size="11">• Locality Safety Scoring</text>
  <text x="750" y="405" fill="#94A3B8" font-size="11">• Verified Incident Radar</text>
  <text x="750" y="420" fill="#94A3B8" font-size="11">• Patrol Recommendations</text>

  <!-- Arrows Backend -> Data -->
  <path d="M 500 455 L 500 490" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="500,495 495,485 505,485" fill="#F59E0B"/>

  <!-- Persistence & External Services -->
  <rect x="40" y="495" width="920" height="85" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="520" fill="#FBBF24" font-size="12" font-weight="700" letter-spacing="1">PERSISTENCE &amp; THIRD-PARTY INFRASTRUCTURE LAYER</text>

  <rect x="60" y="530" width="260" height="40" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="75" y="555" fill="#F8FAFC" font-size="12" font-weight="600">SQLite / PostgreSQL DB (SQLAlchemy)</text>

  <rect x="370" y="530" width="260" height="40" rx="6" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
  <text x="385" y="555" fill="#F8FAFC" font-size="12" font-weight="600">Firebase Auth &amp; Cloud Messaging</text>

  <rect x="680" y="530" width="260" height="40" rx="6" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
  <text x="695" y="555" fill="#F8FAFC" font-size="12" font-weight="600">Twilio SMS / OpenStreetMap Nominatim</text>
</svg>
