<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">END-TO-END SOS DISPATCH LIFECYCLE</text>
  <text x="500" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">State Transitions • 1–5km Proximity Broadcast • Real-Time Tracking</text>

  <!-- Stage 1: Trigger -->
  <rect x="30" y="90" width="160" height="220" rx="10" fill="#1E293B" stroke="#EC4899" stroke-width="2" filter="url(#boxShadow)"/>
  <rect x="45" y="105" width="30" height="30" rx="6" fill="#EC4899"/>
  <text x="55" y="126" fill="#FFF" font-size="14" font-weight="bold">1</text>
  <text x="85" y="125" fill="#F8FAFC" font-size="14" font-weight="bold">TRIGGER</text>
  <text x="45" y="155" fill="#F472B6" font-size="11" font-weight="600">Civilian Action:</text>
  <text x="45" y="175" fill="#CBD5E1" font-size="11">• 3s Long-Press SOS</text>
  <text x="45" y="195" fill="#CBD5E1" font-size="11">• Voice "Help" / Shake</text>
  <text x="45" y="215" fill="#CBD5E1" font-size="11">• 5s Cancel Window</text>
  <text x="45" y="245" fill="#94A3B8" font-size="10">Emergency beacon</text>
  <text x="45" y="260" fill="#94A3B8" font-size="10">created with GPS</text>
  <rect x="45" y="275" width="130" height="22" rx="4" fill="#334155"/>
  <text x="110" y="290" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="600">STATE: PENDING</text>

  <!-- Line 1 -> 2 -->
  <line x1="190" y1="200" x2="225" y2="200" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Dispatch -->
  <rect x="225" y="90" width="160" height="220" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="2" filter="url(#boxShadow)"/>
  <rect x="240" y="105" width="30" height="30" rx="6" fill="#3B82F6"/>
  <text x="250" y="126" fill="#FFF" font-size="14" font-weight="bold">2</text>
  <text x="280" y="125" fill="#F8FAFC" font-size="14" font-weight="bold">DISPATCH</text>
  <text x="240" y="155" fill="#60A5FA" font-size="11" font-weight="600">FastAPI Engine:</text>
  <text x="240" y="175" fill="#CBD5E1" font-size="11">• Haversine Filter</text>
  <text x="240" y="195" fill="#CBD5E1" font-size="11">• 1–5km On-Duty Units</text>
  <text x="240" y="215" fill="#CBD5E1" font-size="11">• Push Alert Broadcast</text>
  <text x="240" y="245" fill="#94A3B8" font-size="10">SMS to Guardians with</text>
  <text x="240" y="260" fill="#94A3B8" font-size="10">live tracking URL</text>
  <rect x="240" y="275" width="130" height="22" rx="4" fill="#1E3A8A"/>
  <text x="305" y="290" text-anchor="middle" fill="#93C5FD" font-size="10" font-weight="600">BROADCASTING</text>

  <!-- Line 2 -> 3 -->
  <line x1="385" y1="200" x2="420" y2="200" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Accept -->
  <rect x="420" y="90" width="160" height="220" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="2" filter="url(#boxShadow)"/>
  <rect x="435" y="105" width="30" height="30" rx="6" fill="#F59E0B"/>
  <text x="445" y="126" fill="#FFF" font-size="14" font-weight="bold">3</text>
  <text x="475" y="125" fill="#F8FAFC" font-size="14" font-weight="bold">ACCEPT</text>
  <text x="435" y="155" fill="#FBBF24" font-size="11" font-weight="600">First Officer Response:</text>
  <text x="435" y="175" fill="#CBD5E1" font-size="11">• Atomic DB Lock</text>
  <text x="435" y="195" fill="#CBD5E1" font-size="11">• Dismiss other units</text>
  <text x="435" y="215" fill="#CBD5E1" font-size="11">• Route &amp; GPS reveal</text>
  <text x="435" y="245" fill="#94A3B8" font-size="10">User notified: Officer</text>
  <text x="435" y="260" fill="#94A3B8" font-size="10">Name, Badge, ETA</text>
  <rect x="435" y="275" width="130" height="22" rx="4" fill="#78350F"/>
  <text x="500" y="290" text-anchor="middle" fill="#FDE68A" font-size="10" font-weight="600">STATE: ACCEPTED</text>

  <!-- Line 3 -> 4 -->
  <line x1="580" y1="200" x2="615" y2="200" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: En Route & Scene -->
  <rect x="615" y="90" width="160" height="220" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="2" filter="url(#boxShadow)"/>
  <rect x="630" y="105" width="30" height="30" rx="6" fill="#8B5CF6"/>
  <text x="640" y="126" fill="#FFF" font-size="14" font-weight="bold">4</text>
  <text x="670" y="125" fill="#F8FAFC" font-size="14" font-weight="bold">EN ROUTE</text>
  <text x="630" y="155" fill="#A78BFA" font-size="11" font-weight="600">Tactical Response:</text>
  <text x="630" y="175" fill="#CBD5E1" font-size="11">• Real-time GPS stream</text>
  <text x="630" y="195" fill="#CBD5E1" font-size="11">• EN_ROUTE milestone</text>
  <text x="630" y="215" fill="#CBD5E1" font-size="11">• ON_SCENE arrival</text>
  <text x="630" y="245" fill="#94A3B8" font-size="10">Victim coordinates</text>
  <text x="630" y="260" fill="#94A3B8" font-size="10">tracked continuously</text>
  <rect x="630" y="275" width="130" height="22" rx="4" fill="#4C1D95"/>
  <text x="695" y="290" text-anchor="middle" fill="#DDD6FE" font-size="10" font-weight="600">STATE: ON_SCENE</text>

  <!-- Line 4 -> 5 -->
  <line x1="775" y1="200" x2="810" y2="200" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5: Resolution -->
  <rect x="810" y="90" width="160" height="220" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="2" filter="url(#boxShadow)"/>
  <rect x="825" y="105" width="30" height="30" rx="6" fill="#10B981"/>
  <text x="835" y="126" fill="#FFF" font-size="14" font-weight="bold">5</text>
  <text x="865" y="125" fill="#F8FAFC" font-size="14" font-weight="bold">RESOLVE</text>
  <text x="825" y="155" fill="#34D399" font-size="11" font-weight="600">Incident Debrief:</text>
  <text x="825" y="175" fill="#CBD5E1" font-size="11">• Officer Case Notes</text>
  <text x="825" y="195" fill="#CBD5E1" font-size="11">• Citizen Safe Signal</text>
  <text x="825" y="215" fill="#CBD5E1" font-size="11">• Admin Audit Record</text>
  <text x="825" y="245" fill="#94A3B8" font-size="10">Crime log generated</text>
  <text x="825" y="260" fill="#94A3B8" font-size="10">for precinct heatmap</text>
  <rect x="825" y="275" width="130" height="22" rx="4" fill="#064E3B"/>
  <text x="890" y="290" text-anchor="middle" fill="#A7F3D0" font-size="10" font-weight="600">STATE: RESOLVED</text>

  <!-- Bottom workflow status strip -->
  <rect x="30" y="330" width="940" height="35" rx="6" fill="#1E293B"/>
  <text x="500" y="352" text-anchor="middle" fill="#94A3B8" font-size="11">
    <tspan fill="#EC4899" font-weight="bold">PENDING</tspan> ➔ 
    <tspan fill="#3B82F6" font-weight="bold">BROADCASTED</tspan> ➔ 
    <tspan fill="#F59E0B" font-weight="bold">ACCEPTED</tspan> ➔ 
    <tspan fill="#8B5CF6" font-weight="bold">EN_ROUTE</tspan> ➔ 
    <tspan fill="#A78BFA" font-weight="bold">ON_SCENE</tspan> ➔ 
    <tspan fill="#10B981" font-weight="bold">RESOLVED</tspan> (Total Latency: &lt; 350ms)
  </text>
</svg>
