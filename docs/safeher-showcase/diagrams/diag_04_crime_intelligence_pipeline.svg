<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="ciShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="ciArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
  </defs>

  <text x="500" y="35" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">COMMUNITY CRIME INTELLIGENCE &amp; ANALYTICS PIPELINE</text>
  <text x="500" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">Incident Ingestion • Dual-Verification Audit • Spatial Density Scoring • Actionable Intel</text>

  <!-- Step 1: Ingestion -->
  <rect x="40" y="90" width="200" height="210" rx="10" fill="#1E293B" stroke="#EC4899" stroke-width="1.5" filter="url(#ciShadow)"/>
  <rect x="55" y="105" width="28" height="28" rx="6" fill="#EC4899"/>
  <text x="64" y="124" fill="#FFF" font-size="13" font-weight="bold">1</text>
  <text x="92" y="124" fill="#F8FAFC" font-size="14" font-weight="bold">INGESTION</text>
  <text x="55" y="155" fill="#F472B6" font-size="11" font-weight="600">Incident Sources:</text>
  <text x="55" y="175" fill="#CBD5E1" font-size="11">• Citizen Crime Reports</text>
  <text x="55" y="195" fill="#CBD5E1" font-size="11">• Resolved SOS Events</text>
  <text x="55" y="215" fill="#CBD5E1" font-size="11">• Anonymous Logging</text>
  <text x="55" y="240" fill="#94A3B8" font-size="10">Captures crime type, GPS,</text>
  <text x="55" y="255" fill="#94A3B8" font-size="10">timestamp &amp; description</text>
  <rect x="55" y="270" width="170" height="20" rx="4" fill="#831843"/>
  <text x="140" y="284" text-anchor="middle" fill="#FBCFE8" font-size="10" font-weight="600">STATUS: UNVERIFIED</text>

  <line x1="240" y1="195" x2="275" y2="195" stroke="#10B981" stroke-width="2" marker-end="url(#ciArrow)"/>

  <!-- Step 2: Verification -->
  <rect x="275" y="90" width="200" height="210" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5" filter="url(#ciShadow)"/>
  <rect x="290" y="105" width="28" height="28" rx="6" fill="#8B5CF6"/>
  <text x="299" y="124" fill="#FFF" font-size="13" font-weight="bold">2</text>
  <text x="327" y="124" fill="#F8FAFC" font-size="14" font-weight="bold">AUDIT GATE</text>
  <text x="290" y="155" fill="#C084FC" font-size="11" font-weight="600">Admin Control:</text>
  <text x="290" y="175" fill="#CBD5E1" font-size="11">• Evidence Review</text>
  <text x="290" y="195" fill="#CBD5E1" font-size="11">• False Report Purge</text>
  <text x="290" y="215" fill="#CBD5E1" font-size="11">• Endorse as Official</text>
  <text x="290" y="240" fill="#94A3B8" font-size="10">Prevents vigilantism &amp;</text>
  <text x="290" y="255" fill="#94A3B8" font-size="10">community panic</text>
  <rect x="290" y="270" width="170" height="20" rx="4" fill="#4C1D95"/>
  <text x="375" y="284" text-anchor="middle" fill="#DDD6FE" font-size="10" font-weight="600">STATUS: VERIFIED</text>

  <line x1="475" y1="195" x2="510" y2="195" stroke="#10B981" stroke-width="2" marker-end="url(#ciArrow)"/>

  <!-- Step 3: Spatial Scoring -->
  <rect x="510" y="90" width="200" height="210" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" filter="url(#ciShadow)"/>
  <rect x="525" y="105" width="28" height="28" rx="6" fill="#F59E0B"/>
  <text x="534" y="124" fill="#FFF" font-size="13" font-weight="bold">3</text>
  <text x="562" y="124" fill="#F8FAFC" font-size="14" font-weight="bold">ALGORITHM</text>
  <text x="525" y="155" fill="#FBBF24" font-size="11" font-weight="600">Spatial Analytics:</text>
  <text x="525" y="175" fill="#CBD5E1" font-size="11">• Density Clustering</text>
  <text x="525" y="195" fill="#CBD5E1" font-size="11">• Locality Safety Index</text>
  <text x="525" y="215" fill="#CBD5E1" font-size="11">• Risk Bands (Low/Med/High)</text>
  <text x="525" y="240" fill="#94A3B8" font-size="10">Computes score 0-100</text>
  <text x="525" y="255" fill="#94A3B8" font-size="10">based on verified frequency</text>
  <rect x="525" y="270" width="170" height="20" rx="4" fill="#78350F"/>
  <text x="610" y="284" text-anchor="middle" fill="#FDE68A" font-size="10" font-weight="600">HEATMAP COMPUTED</text>

  <line x1="710" y1="195" x2="745" y2="195" stroke="#10B981" stroke-width="2" marker-end="url(#ciArrow)"/>

  <!-- Step 4: Dissemination -->
  <rect x="745" y="90" width="215" height="210" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.5" filter="url(#ciShadow)"/>
  <rect x="760" y="105" width="28" height="28" rx="6" fill="#10B981"/>
  <text x="769" y="124" fill="#FFF" font-size="13" font-weight="bold">4</text>
  <text x="797" y="124" fill="#F8FAFC" font-size="14" font-weight="bold">OUTPUT</text>
  <text x="760" y="155" fill="#34D399" font-size="11" font-weight="600">Actionable Intel:</text>
  <text x="760" y="175" fill="#CBD5E1" font-size="11">• Citizen Radar &amp; Heatmap</text>
  <text x="760" y="195" fill="#CBD5E1" font-size="11">• Police Recommendations</text>
  <text x="760" y="215" fill="#CBD5E1" font-size="11">• Official Safety Advisories</text>
  <text x="760" y="240" fill="#94A3B8" font-size="10">Alerts public &amp; guides</text>
  <text x="760" y="255" fill="#94A3B8" font-size="10">patrol unit positioning</text>
  <rect x="760" y="270" width="185" height="20" rx="4" fill="#064E3B"/>
  <text x="852" y="284" text-anchor="middle" fill="#A7F3D0" font-size="10" font-weight="600">ACTIONABLE DEPLOYMENT</text>

  <rect x="40" y="325" width="920" height="35" rx="6" fill="#1E293B"/>
  <text x="500" y="347" text-anchor="middle" fill="#94A3B8" font-size="11">
    Raw Incident Data ➔ Verified Gate ➔ Spatial Scoring ➔ Citizen Awareness &amp; Tactical Police Deployments
  </text>
</svg>
